# .github/workflows/docs.yml
#
# Build-checks the Sphinx docs on every push/PR so a broken doc build
# (bad toctree entry, failing autodoc import, warnings-as-errors) is
# caught here instead of showing up as a failed build on
# https://mneflow.readthedocs.io/ after merge.
#
# This does NOT deploy anything -- Read the Docs builds and publishes the
# live site itself (via its own GitHub webhook, using the root
# .readthedocs.yaml) whenever master is pushed. This workflow is a fast,
# local pre-check of the same build.
name: Docs

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build docs (warnings treated as errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: ignore
