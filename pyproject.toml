[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mneflow"
version = "0.6.1"
description = "Neural networks for MEG and EEG data"
readme = "README.md"
license = { text = "BSD-3-Clause" }
maintainers = [
    { name = "Ivan Zubarev", email = "ivan.zubarev@aalto.fi" },
]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.23.5,<2.0",  # tensorflow<=2.16rc hard-requires numpy<2 
    "scipy<1.15",  # scipy 1.15 removed scipy.special.sph_harm, which mne<=1.7 still imports
    "mne>=1.0,<=1.7",
    "tensorflow>=2.12.0,<=2.16rc",
    "matplotlib",
    "dill",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "nbformat",   # for tests/test_examples.py, which executes the example notebooks
    "nbclient",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/zubara/mneflow"
Download = "https://github.com/zubara/mneflow/archive/master.zip"

[tool.setuptools]
packages = ["mneflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=mneflow --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
