[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mneflow"
version = "0.7.0"
description = "Neural networks for MEG and EEG data"
readme = "README.md"
license = { text = "BSD-3-Clause" }
maintainers = [
    { name = "Ivan Zubarev", email = "ivan.zubarev@aalto.fi" },
]
requires-python = ">=3.10, <3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
# Ranges verified 2026-09-22 (Python 3.10-3.12; 3.13 dropped along with the
# Python 3.9 floor -- see below). No numpy/scipy ceiling is pinned here on
# purpose: tensorflow and mne each declare their own numpy/scipy ceiling per
# release, so pip's resolver already finds a jointly-compatible set for
# whatever tensorflow/mne version it lands on within the ranges below.
#
# mne>=1.10 is a floor, not a preference: mne<1.10 calls
# `scipy.special.sph_harm` directly, which scipy removed in 1.17 (deprecated
# since 1.15); mne 1.10.0 is the first release with its own sph_harm_y
# fallback wrapper. mne>=1.10 requires Python>=3.10, which is why the
# Python floor below moved from 3.9 to 3.10 -- there is no mne version that
# is both >=1.10 and installable on Python 3.9.
#
# tensorflow>=2.16.1 is a floor because 2.16 is the first TensorFlow release
# whose bundled Keras defaults to Keras 3, which is what makes tf.keras.ops
# (used via mneflow/_compat.py) available; 2.16.1 rather than 2.16.0 because
# 2.16.0 was never published as a final release and 2.16.1 is also the first
# tag with a cp312 wheel. See README "Supported / tested versions" for the
# resulting per-Python-version table.
dependencies = [
    "numpy>=1.23.5",
    "scipy",
    "mne>=1.10,<=1.13.2",
    "tensorflow>=2.16.1,<=2.21.0",
    "keras>=3.0,<4",
    "matplotlib",
    "dill",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "nbformat",   # for tests/test_examples.py, which executes the example notebooks
    "nbclient",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/zubara/mneflow"
Download = "https://github.com/zubara/mneflow/archive/master.zip"

[tool.setuptools]
packages = ["mneflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=mneflow --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 79
extend-exclude = ["docs", "*.ipynb"]

[tool.ruff.format]
# Only applied to new code (see the lint section); keep the code base's
# mix of quote styles
quote-style = "preserve"

[tool.ruff.lint]
# Errors and likely bugs (pyflakes, bugbear, pycodestyle error classes).
# Style-only rules and formatting are not enforced on the existing code,
# to keep the diff to upstream small.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B006",  # mutable argument defaults: all are read-only (checked)
    "B007",  # unused loop variables
    "B905",  # zip() without strict=
]

[tool.ruff.lint.per-file-ignores]
"mneflow/__init__.py" = ["F401"]  # public re-exports
"tests/*" = ["B017"]              # pytest.raises(Exception) in some tests

[tool.pyright]
include = ["mneflow", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# mneflow is largely untyped and its TensorFlow/Keras objects have incomplete
# type stubs, so these checks mostly report false positives here (e.g.
# attributes set at runtime, Keras tensors typed as possibly None). They are
# reported as warnings instead of errors.
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"
reportPossiblyUnbound = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportOperatorIssue = "warning"
reportIncompatibleMethodOverride = "warning"
